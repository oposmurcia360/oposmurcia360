<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Corrección conjunta</title>
<style>body{font-family:system-ui;background:#f4f7fb;color:#17324d}main{max-width:800px;margin:40px auto;background:white;padding:25px;border-radius:18px}button{padding:13px 18px;border:0;border-radius:12px;font-weight:700;margin-right:8px}.a{background:#eef5fa;color:#06709b}.b{background:#06709b;color:white}#s{margin-top:18px;padding:14px;background:#f5f7fa;border-radius:10px;white-space:pre-wrap}</style></head><body><main>
<h2>OposMurcia 360 · Corrección conjunta de supuestos <small style='font-size:13px;color:#667'>V3</small></h2><p>Elimina numeración duplicada y los dígitos espurios detectados. No modifica respuestas correctas.</p>
<button id="l" class="a">1. Entrar con Google</button><button id="r" class="b" disabled>2. Aplicar correcciones</button><div id="s">Esperando inicio de sesión…</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithRedirect,getRedirectResult,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,updateDoc}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDA_79FRQq90gVJgD17dRr_pUHKe4S8XBg",authDomain:"oposmurcia360-5a389.firebaseapp.com",projectId:"oposmurcia360-5a389",storageBucket:"oposmurcia360-5a389.firebasestorage.app",messagingSenderId:"730198455785",appId:"1:730198455785:web:1f3e3d4f8edf8774780778"}),auth=getAuth(app),db=getFirestore(app),S=document.querySelector("#s"),R=document.querySelector("#r");
const tk=q=>["text","question","enunciado","pregunta"].find(k=>typeof q?.[k]=="string");
const blob=(d,id)=>((d.title||"")+" "+(d.description||"")+" "+id).toLowerCase();
const rep1=b=>b.includes("repaso 1"),rep2=b=>b.includes("repaso 2"),jul=b=>b.includes("16 julio 2026")&&(b.includes("repaso")||b.includes("resumen"));
const concejal=q=>{let k=tk(q);return k&&q[k].toLowerCase().includes("un concejal no perteneciente a la junta de gobierno solicita asistir")};
function cleanOpt(q){let k=["options","answers","respuestas","opciones"].find(x=>Array.isArray(q?.[x]));if(!k)return q;return{...q,[k]:q[k].map(x=>{if(typeof x=="string"&&x.toLowerCase().includes("no existe derecho específico fuera de la negociación colectiva"))return x.replace(/\s*3\s*$/,"").trim();if(x&&typeof x=="object"){let z=["text","label","texto","respuesta"].find(y=>typeof x[y]=="string");if(z&&x[z].toLowerCase().includes("no existe derecho específico fuera de la negociación colectiva"))return{...x,[z]:x[z].replace(/\s*3\s*$/,"").trim()}return x}return x})}}
getRedirectResult(auth).catch(e=>{S.textContent="ERROR AL VOLVER DE GOOGLE: "+(e.message||e)});
onAuthStateChanged(auth,u=>{if(u){S.textContent="Sesión iniciada como "+u.email+"\nYa puedes pulsar «2. Aplicar correcciones».";R.disabled=false}else{S.textContent="Sin sesión iniciada. Pulsa «1. Entrar con Google».";R.disabled=true}});
document.querySelector("#l").onclick=async()=>{try{S.textContent="Redirigiendo a Google…";let p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});await signInWithRedirect(auth,p)}catch(e){S.textContent="ERROR DE ACCESO: "+(e.message||e)}};
R.onclick=async()=>{R.disabled=true;S.textContent="Revisando…";try{let snap=await getDocs(collection(db,"supuestos")),dc=0,qc=0,rep=[];for(let ds of snap.docs){let d=ds.data(),b=blob(d,ds.id),qs=Array.isArray(d.questions)?d.questions:null;if(!qs)continue;if(!(rep1(b)||rep2(b)||jul(b)||qs.some(concejal)))continue;let ch=false,nq=qs.map(q0=>{let q={...q0},c=false,k=tk(q);if(k){let z=q[k].replace(/^\s*\d+\s*[.\-)]\s*/,"").trim();if(z!=q[k]){q[k]=z;c=true}if(concejal(q)){z=q[k].replace(/\?\s*2\s*$/,"?").trim();if(z!=q[k]){q[k]=z;c=true}}if(jul(b)&&q[k].toLowerCase().includes("disponibilidad presencial diaria hasta las 20:00")){z=q[k].replace(/\?\s*2\s*$/,"?").trim();if(z!=q[k]){q[k]=z;c=true}}}if(jul(b)){let a=JSON.stringify(q);q=cleanOpt(q);if(JSON.stringify(q)!=a)c=true}if(c){ch=true;qc++}return q});if(ch){await updateDoc(doc(db,"supuestos",ds.id),{questions:nq});dc++;rep.push("✓ "+ds.id)}}if(!dc)throw Error("No se encontró ningún documento que necesitara estas correcciones.");S.textContent="CORRECCIÓN COMPLETADA\nDocumentos modificados: "+dc+"\nEntradas limpiadas: "+qc+"\n\n"+rep.join("\n")+"\n\nRespuestas correctas: sin cambios."}catch(e){S.textContent="NO SE HA PODIDO CORREGIR\n"+e.message;R.disabled=false}};
</script></main></body></html>
