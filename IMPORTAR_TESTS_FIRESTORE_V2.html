const tests=[{"id":"constitucion-tema-1","title":"Constitución Española · Tema 1","subtitle":"Auxiliares 2026","description":"Concepto, estructura y reformas constitucionales","questions":[["La Constitución puede definirse, desde un punto de vista general, como:",["La norma fundamental, escrita o no, de un Estado soberano","Un conjunto de normas políticas sin valor jurídico","Una ley ordinaria aprobada por las Cortes Generales"],0],["Desde el punto de vista material, la Constitución se define como:",["El texto aprobado mediante un procedimiento especial","El conjunto de reglas fundamentales aplicables al ejercicio del poder estatal","La norma aprobada por referéndum popular"],1],["Desde el punto de vista formal, la Constitución se caracteriza principalmente por:",["Su origen histórico","Su supremacía sobre cualquier otra norma del ordenamiento jurídico","Su contenido ideológico"],1],["¿Cuál de las siguientes NO aparece como nota característica de la concepción moderna de la Constitución?",["Es una norma jurídica","Es una norma fundante","Es una norma reglamentaria"],2],["La Constitución Española fue aprobada en referéndum el día:",["6 de diciembre de 1978","27 de diciembre de 1978","29 de diciembre de 1978"],0],["La Constitución Española fue publicada en el BOE el:",["6 de diciembre de 1978","27 de diciembre de 1978","29 de diciembre de 1978"],2],["El término “Constitución” procede etimológicamente del latín:",["Lex y ordo","Cum y statuere","Res y publica"],1],["Una de las funciones esenciales de la Constitución es:",["Fijar los límites y relaciones entre los poderes del Estado","Regular exclusivamente los derechos económicos","Establecer únicamente la organización territorial"],0],["La Constitución garantiza al pueblo:",["Únicamente deberes cívicos","Derechos y libertades","Solo derechos políticos"],1],["Desde el punto de vista material, la Constitución se refiere principalmente a:",["Su procedimiento de aprobación","Su rango normativo","El ejercicio del poder estatal"],2],["El sentido formal de la Constitución se caracteriza por atender a:",["Su contenido ideológico","Los órganos y procedimientos de adopción","Los valores superiores del ordenamiento"],1],["La supremacía de la Constitución sobre el resto del ordenamiento deriva:",["De su carácter histórico","De su sentido formal","De su contenido económico"],1],["Entre los elementos que regula la Constitución se encuentran:",["La organización de los poderes públicos y sus competencias","Solo los derechos fundamentales","Únicamente la economía del Estado"],0],["Una de las notas de la concepción moderna de la Constitución es que:",["Es una norma reglamentaria","Es una norma fundante del orden político y jurídico","Es una norma subordinada a la ley"],1],["Según la concepción moderna recogida en el tema, la Constitución:",["Se limita a declarar principios políticos","Carece de fuerza jurídica directa","Regula los órganos y procedimientos de producción normativa"],2],["¿Cuántas reformas constitucionales se han aprobado hasta el momento?",["Tres","Dos","Cuatro"],0],["La reforma constitucional de 1992 afectó al artículo:",["49","135","13.2"],2],["La reforma del artículo 135 de la Constitución se produjo en el año:",["1992","2011","2024"],1],["La reforma constitucional de 2024 se refiere al:",["Principio de estabilidad presupuestaria","Derecho de sufragio","Lenguaje y protección de las personas con discapacidad"],2],["Formalmente, la Constitución Española consta de:",["168 artículos","169 artículos","170 artículos"],1],["¿Cuántas disposiciones transitorias contiene la Constitución?",["Cuatro","Nueve","Diez"],1],["El Preámbulo de la Constitución se caracteriza por:",["Su extensión detallada","Su carácter normativo directo","Su brevedad y contenido ideológico"],2],["El Título Preliminar de la Constitución contiene:",["Principios generales","Derechos fundamentales","Normas económicas"],0],["¿Cuántos artículos integran el Título I de la Constitución?",["46","45","47"],0],["El Capítulo tercero del Título I se refiere a:",["Los principios rectores de la política social y económica","La nacionalidad","La suspensión de derechos"],0]]},{"id":"repaso-general-2","title":"Repaso Parte General 2","subtitle":"Auxiliares · Agosto 2026","description":"Constitución, padrón y régimen local","questions":[["Una ley ordinaria pretende desarrollar el contenido esencial de un derecho comprendido entre los artículos 15 y 29 CE. Atendiendo exclusivamente al sistema de garantías, ¿qué objeción es correcta?",["Ninguna, porque basta el rango de ley siempre que no se vulnere el derecho.","El desarrollo de sus aspectos esenciales exige ley orgánica, además del respeto al contenido esencial.","Sólo sería necesaria ley orgánica si el derecho estuviera además incluido en el artículo 14 CE."],1],["Se pretende invocar directamente ante un órgano administrativo un principio rector del Capítulo III del Título I sin que exista ley que lo desarrolle. Según el régimen de garantías, ¿qué afirmación es correcta?",["Los principios del Capítulo III informan la legislación, la práctica judicial y la actuación de los poderes públicos, y sólo pueden alegarse ante la jurisdicción conforme a las leyes que los desarrollen.","Todos los principios rectores tienen la misma aplicación directa que los derechos del Capítulo II.","Sólo los principios de los artículos 39 a 44 carecen de aplicación directa; los restantes sí la tienen y pueden hacerse valer directamente ante cualquier órgano público aun sin desarrollo legal específico."],0],["Durante un estado de excepción se acuerda suspender el derecho del detenido a ser informado de sus derechos y a la asistencia letrada. Conforme a la precisión sobre el artículo 55.1 CE, ¿qué valoración procede?",["Es admisible, porque todo el artículo 17 CE puede suspenderse en estado de excepción incluyendo en todo caso la información de derechos y la asistencia letrada desde el inicio de la detención.","Es admisible únicamente si lo autoriza el Congreso por mayoría absoluta.","No se ajusta al régimen expuesto, pues el artículo 17.3 queda exceptuado de suspensión en el estado de excepción."],2],["Una reforma constitucional afecta sólo al artículo 135 CE. Sin entrar en la oportunidad política de la reforma, ¿qué procedimiento resulta del esquema?",["El del artículo 168 CE porque toda reforma posterior a 2011 debe seguir el procedimiento agravado.","El del artículo 168 CE por afectar al principio de estabilidad presupuestaria.","El del artículo 167 CE, salvo que simultáneamente se reforme alguna materia reservada al artículo 168."],2],["¿Cuál de las siguientes combinaciones refleja correctamente la distribución sistemática del Título I?",["Artículo 14 dentro de la Sección 1.ª; artículos 15 a 29 fuera de secciones; artículos 30 a 38 en el Capítulo III y los principios rectores de los artículos 39 a 52 quedan integrados en la misma Sección 2.ª.","Artículo 14 como precepto inicial del Capítulo II; artículos 15 a 29 en la Sección 1.ª y artículos 30 a 38 en la Sección 2.ª.","Artículos 14 a 29 en la Sección 1.ª y artículos 30 a 52 en la Sección 2.ª."],1],["Una Administración acuerda el secuestro preventivo de una publicación mediante resolución administrativa motivada, sin intervención judicial. ¿Qué precepto determina directamente la invalidez constitucional de esa medida?",["El artículo 18.3 CE, porque todo secuestro constituye interceptación de comunicaciones siempre que la resolución administrativa sea motivada y se notifique antes de ejecutarse la medida.","El artículo 21.2 CE, porque equivale a prohibir una manifestación.","El artículo 20 CE, que reserva el secuestro de publicaciones, grabaciones y otros medios a resolución judicial."],2],["Una asociación está válidamente constituida e inscrita, pero posteriormente utiliza medios tipificados como delito. Según el artículo 22 CE, señale la respuesta más precisa:",["La asociación es ilegal por los medios empleados; su disolución o suspensión exige resolución judicial motivada.","La inscripción impide apreciar ilegalidad mientras no sea cancelada administrativamente.","La Administración puede suspenderla de inmediato, aunque sólo un juez puede disolverla definitivamente hasta que el registro administrativo competente acuerde formalmente la pérdida de personalidad jurídica."],0],["Un tribunal pretende obligar a una persona a confesarse culpable para poder beneficiarse de una determinada garantía procesal. ¿Qué conjunto de derechos del artículo 24.2 CE resulta directamente afectado?",["Exclusivamente el derecho al juez ordinario predeterminado por la ley y a obtener una resolución sobre el fondo aunque no concurran los presupuestos procesales establecidos por la ley.","Los derechos a no declarar contra sí mismo y a no confesarse culpable.","Sólo el derecho a utilizar los medios de prueba pertinentes."],1],["Una sanción administrativa se impone por una conducta que, cuando se realizó, no constituía infracción administrativa. ¿Qué regla resuelve el supuesto de forma inmediata?",["El artículo 25.1 CE impide sancionar acciones u omisiones que no fueran infracción según la legislación vigente al producirse.","El artículo 24.1 CE sólo exige que exista audiencia antes de sancionar.","El artículo 26 CE permite la sanción si no interviene un tribunal de honor siempre que la norma sancionadora posterior sea más favorable y la Administración motive suficientemente su aplicación."],0],["Respecto del derecho de sindicación del artículo 28 CE, ¿cuál de las siguientes opciones reproduce con mayor exactitud el régimen aplicable?",["La Constitución excluye directamente a todos los funcionarios públicos del derecho de sindicación.","La ley puede limitar o exceptuar su ejercicio para Fuerzas o Institutos armados y cuerpos sometidos a disciplina militar, y regular peculiaridades para funcionarios públicos.","La ley sólo puede limitar el derecho respecto de miembros de las Fuerzas Armadas, nunca respecto de otros cuerpos sometidos a disciplina militar mediante una prohibición general aplicable a todo el personal funcionario y estatutario de las Administraciones públicas."],1],["Un miembro de un cuerpo sometido a disciplina militar formula una petición colectiva por escrito junto con otros miembros del cuerpo. Según el artículo 29 CE:",["Es posible si la petición no tiene contenido político cuando la petición se tramite por escrito, identifique a todos los firmantes y respete la cadena jerárquica del cuerpo.","Es posible si se presenta por conducto reglamentario.","No se ajusta al régimen constitucional, pues sólo pueden ejercer ese derecho individualmente y conforme a su legislación específica."],2],["Una ley reconoce una prestación patrimonial pública cuya cuantía puede ser fijada íntegramente por una ordenanza sin cobertura legal adicional. Atendiendo al artículo 31.3 CE, la afirmación correcta es:",["Las prestaciones personales o patrimoniales de carácter público sólo pueden establecerse con arreglo a la ley.","La reserva de ley sólo alcanza a los tributos estatales, no a prestaciones locales cuando la cuantía sea inferior al límite que determine anualmente la correspondiente ley de presupuestos.","La Constitución permite su establecimiento reglamentario cuando no tengan naturaleza tributaria."],0],["Una fundación se constituye para un fin estrictamente particular, sin finalidad de interés general. ¿Qué precisión del artículo 34 CE resulta relevante?",["El derecho de fundación se reconoce sin limitación alguna en cuanto a los fines siempre que la escritura fundacional delimite con precisión beneficiarios, patrimonio y órganos de gobierno.","El derecho de fundación se reconoce para fines de interés general, con arreglo a la ley.","La Constitución sólo reconoce fundaciones creadas por Administraciones públicas."],1],["En materia de negociación colectiva laboral, el artículo 37 CE garantiza expresamente:",["La prohibición absoluta de medidas de conflicto colectivo en servicios esenciales.","La aprobación administrativa previa de todo convenio colectivo.","La fuerza vinculante de los convenios."],2],["Una persona vive habitualmente en un municipio pero carece de domicilio físico estable. Antes de inscribirla en el Padrón, ¿qué actuación exige el artículo 54 RPDT?",["Un informe vinculante del Consejo de Empadronamiento emitido antes de la inscripción y con carácter vinculante para el Ayuntamiento sobre la realidad de la residencia.","Una autorización de la Diputación provincial.","Poner el hecho en conocimiento de los servicios sociales competentes en el ámbito donde resida."],2],["Un vecino solicita que se ceda a otra Administración su número de teléfono aportado voluntariamente al Padrón. Conforme al artículo 16 LRBRL, ¿qué respuesta es correcta?",["Puede cederse si el domicilio es relevante para la competencia de la Administración solicitante.","Los datos de aportación voluntaria no son susceptibles de cesión en ningún caso.","Puede cederse siempre con autorización del Alcalde, aunque el interesado no consienta."],1],["El Ayuntamiento remite al INE su revisión padronal anual y existe discrepancia sobre la cifra resultante. Conforme a los artículos 81 y 82 RPDT, ¿qué secuencia es correcta?",["El INE formula reparos; si persiste el desacuerdo, somete la discrepancia al Consejo de Empadronamiento y la Presidencia del INE eleva al Gobierno la propuesta de cifras oficiales con informe favorable del Consejo.","El Ayuntamiento fija definitivamente la cifra; el INE sólo puede formular observaciones no vinculantes.","La discrepancia se resuelve mediante recurso de alzada ante el Ministerio competente y la cifra se aprueba por orden ministerial siendo la propuesta del Ayuntamiento vinculante para el Gobierno si fue aprobada por mayoría absoluta del Pleno."],0],["Un ciudadano pide al INE una certificación de empadronamiento utilizando los datos de la base padronal estatal. Según el artículo 83 RPDT:",["El INE puede expedirla si coincide con la última revisión anual siempre que la persona interesada autorice expresamente al INE y no exista oposición del Ayuntamiento de residencia.","El INE sólo puede expedirla cuando exista autorización municipal previa.","Los datos en poder del INE no pueden servir de base para expedir certificaciones o volantes, aunque sí para determinados sistemas de intermediación y Carpeta Ciudadana."],2],["¿Quién expide ordinariamente las certificaciones padronales conforme al artículo 61 RPDT ?",["La persona que ocupe la Secretaría del Ayuntamiento o el funcionario con habilitación nacional que la sustituya, sin perjuicio de la actuación administrativa automatizada.","El Alcalde o cualquier concejal delegado en materia de población.","El Presidente del INE, previa comprobación con la base padronal estatal pudiendo delegarse ordinariamente esta función en cualquier funcionario municipal mediante resolución del Alcalde."],0],["Un municipio se fusiona con otro y, como consecuencia del aumento de población, debería asumir nuevos servicios mínimos del artículo 26 LRBRL. Según los efectos de la fusión:",["Debe implantarlos en el primer ejercicio presupuestario posterior a la fusión.","Queda dispensado de prestar los nuevos servicios mínimos que le correspondan por razón del aumento poblacional.","Sólo queda dispensado durante los dos primeros años desde el convenio de fusión durante un máximo de cinco años, transcurridos los cuales deberá asumirlos aunque persista la situación derivada de la fusión."],1],["En una fusión municipal, uno de los municipios estaba en déficit. Según el régimen aplicable, el fondo sin personalidad jurídica y contabilidad separada que puede constituirse para determinados elementos liquidables debe liquidarse:",["En los cinco años siguientes desde la adopción del convenio de fusión.","En diez años, coincidiendo con la prohibición de segregación del nuevo municipio.","Antes de aprobar el primer presupuesto del municipio resultante."],0],["En un municipio de gran población, un tercio de los miembros del Pleno solicita con antelación suficiente asesoramiento legal sobre un asunto a tratar en sesión. Conforme al artículo 122.5 LRBRL:",["El asesoramiento es potestativo salvo que el asunto exija mayoría especial.","El asesoramiento legal del Secretario General del Pleno es preceptivo en ese supuesto.","Sólo es preceptivo si lo solicita la cuarta parte de los concejales y se trata de función de control."],1],["El Pleno de un municipio de gran población pretende delegar en una comisión plenaria la determinación de las formas de gestión de los servicios municipales. ¿Es posible según el artículo 123 LRBRL?",["Sí, porque la letra k) figura entre las competencias delegables en las comisiones del artículo 122.4.","No, porque ninguna competencia plenaria puede delegarse en comisiones.","Sólo sería posible delegarla en la Junta de Gobierno Local, nunca en una comisión."],0],["El Alcalde de un municipio de gran población desea delegar la competencia para establecer la organización y estructura de la Administración municipal ejecutiva. Según el artículo 124.5 LRBRL:",["No puede delegarse en ningún órgano.","Puede delegarse en cualquier concejal delegado.","Sólo puede delegarse en la Junta de Gobierno Local."],2],["El Alcalde pretende designar Teniente de Alcalde a un concejal que no forma parte de la Junta de Gobierno Local. Conforme al artículo 125 LRBRL:",["Es válido si lo ratifica el Pleno por mayoría simple.","No es posible: los Tenientes de Alcalde se nombran entre los concejales que formen parte de la Junta de Gobierno Local.","Es posible en caso de ausencia temporal de todos los miembros de la Junta de Gobierno Local."],1],["En una Junta de Gobierno Local de gran población, el Alcalde nombra varios miembros no concejales. ¿Qué límite adicional a su número exige el artículo 126 LRBRL, además del límite global de miembros de la Junta?",["Los no concejales no pueden superar un tercio de los miembros de la Junta, excluido el Alcalde.","Los no concejales no pueden superar la mitad del número legal de miembros del Pleno.","Sólo puede existir un miembro no concejal, cualquiera que sea el tamaño de la Junta."],0],["La Junta de Gobierno Local pretende delegar la aprobación de la relación de puestos de trabajo en un director general. Según el artículo 127.2 LRBRL:",["Puede delegarla, pues todas las funciones de personal son delegables.","Puede delegarla únicamente en un Teniente de Alcalde.","No puede delegarla: la aprobación de la RPT está expresamente exceptuada de la delegación prevista para la letra h)."],2],["El Pleno crea distritos en un municipio de gran población. ¿Qué extremo debe determinar en una norma de carácter orgánico conforme al artículo 128 LRBRL?",["El porcentaje mínimo de recursos presupuestarios de la Corporación que gestionarán los distritos en su conjunto.","La identidad nominal de todos los empleados públicos adscritos a cada distrito.","La cuantía máxima de los tributos municipales que puede recaudar cada distrito."],0],["El Pleno de un municipio de gran población crea el órgano de gestión tributaria del artículo 135 LRBRL. ¿Qué efecto específico produce sobre la función de recaudación?",["La recaudación sigue necesariamente en el órgano económico-financiero del artículo 134.","La función de recaudación y su titular quedan adscritos al órgano de gestión tributaria, quedando sin efecto el artículo 134.1 en ese extremo.","La recaudación pasa automáticamente a la Diputación provincial."],1],["Un municipio de 19.500 habitantes pretende que la Diputación coordine uno de los servicios del artículo 26.2 LRBRL. ¿Cuál de los siguientes sí figura entre los servicios sujetos a esa coordinación para municipios de menos de 20.000 habitantes?",["Biblioteca pública.","Instalaciones deportivas de uso público.","Alumbrado público."],2]]},{"id":"test-2-constitucion-espanola-tema-1-auxiliares-2026","title":"Test 2 – Constitución Española (Tema 1)","subtitle":"Auxiliares 2026","description":"Cuestionario de preparación sobre la Constitución Española. Incluye 20 preguntas ordinarias y 5 de reserva.","questions":[["El principio introducido en el art. 135 es:",["Legalidad","Estabilidad presupuestaria","Autonomía local"],1],["La parte dogmática comprende:",["Títulos I a X","Título Preliminar y Título I","Solo el Título I"],1],["El Gobierno y la Administración se regulan en el:",["Título IV","Título V","Título VI"],0],["El Poder Judicial aparece en:",["Título VI","Título VII","Título IX"],0],["Dos principios amplios que informan la Constitución son:",["Legalidad y jerarquía","Democrático y territorial","Social y económico"],1],["Los valores superiores del ordenamiento jurídico son:",["Seguridad y responsabilidad","Mérito y capacidad","Libertad, justicia, igualdad y pluralismo político"],2],["El principio de jerarquía normativa aparece en:",["Art. 1.1","Art. 9.3","Art. 103"],1],["Los principios rectores de política social y económica se recogen en:",["Artículos 39 a 52","Artículos 10 a 20","Artículos 66 a 96"],0],["La Constitución se apoya en cuatro pilares fundamentales entre los que se encuentra:",["Estado federal","República presidencial","Estado social y democrático de Derecho"],2],["El Congreso es:",["Cámara territorial","Cámara de segunda reflexión","Cámara de representación directa"],2],["El Senado se concibe como:",["Cámara ejecutiva","Cámara de representación territorial","Cámara judicial"],1],["El modelo territorial español es:",["Federal","Centralizado","Unitario descentralizado"],2],["El derecho a la autonomía se reconoce junto con:",["Autodeterminación","Solidaridad territorial","Soberanía compartida"],1],["El carácter “social” del Estado implica que:",["El mercado actúa sin intervención","El Estado no participa en economía","El Estado interviene para garantizar bienestar colectivo"],2],["La sumisión de los poderes públicos a la ley es propia de:",["Estado de Derecho","Estado social","Estado territorial"],0],["La autonomía reconocida a las CCAA es:",["Administrativa exclusivamente","Judicial","Política con órganos legislativos propios"],2],["La descentralización española es “derivada” porque:",["Nace de la autodeterminación","Proviene de la unidad nacional y la Constitución","Se impone por tratados"],1],["Cuando el tema distingue parte dogmática y orgánica, se refiere a:",["Normas antiguas y modernas","Derechos frente a organización del poder","Leyes y reglamentos"],1],["Los principios rectores de la política social y económica se caracterizan por:",["Ser inmediatamente exigibles","No depender de leyes","Requerir desarrollo legal para su efectividad"],2],["El pluralismo político se vincula directamente con:",["La soberanía popular","La Monarquía","El Poder Judicial"],0],["[Reserva] Que el Rey sea “árbitro y moderador” significa que:",["Gobierna directamente","Dirige las Cortes","No ejerce funciones ejecutivas"],2],["[Reserva] El mayor protagonismo político lo tiene:",["El Congreso","El Senado","El Tribunal Constitucional"],0],["[Reserva] Que la Constitución sea “norma jurídica” significa que:",["Es solo política","Produce efectos jurídicos obligatorios","Es orientativa"],1],["[Reserva] El uso de valores superiores en la Constitución busca:",["Servir como fundamento del sistema jurídico","Sustituir leyes","Limitar derechos"],0],["[Reserva] El sistema autonómico español se diferencia del federal porque:",["No hay parlamentos autonómicos","La soberanía es compartida","La autonomía deriva de la Constitución y no es originaria"],2]]}];

const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);

$("#login").onclick=async()=>{
 try{
  await signInWithEmailAndPassword(auth,$("#email").value.trim(),$("#password").value);
  $("#msg").className="ok"; $("#msg").textContent="Acceso correcto. Ya puedes importar.";
  $("#import").disabled=false;
 }catch(e){
  $("#msg").className="err"; $("#msg").textContent="Error de acceso: "+e.code;
 }
};

$("#import").onclick=async()=>{
 try{
  $("#import").disabled=true;
  for(let n=0;n<tests.length;n++){
   const t=tests[n];
   const questions={};
   (t.questions||[]).forEach((q,i)=>{
    questions["q"+String(i+1).padStart(3,"0")]={
      text:q[0],
      options:q[1],
      correct:q[2],
      order:i+1
    };
   });
   const {questions:ignored,...rest}=t;
   await setDoc(doc(db,"tests",t.id),{...rest,questions,questionCount:t.questions.length,order:n+1});
  }
  $("#msg").className="ok";
  $("#msg").innerHTML="<strong>Importación terminada correctamente.</strong> Ya puedes restaurar las reglas FINALES.";
 }catch(e){
  console.error(e);
  $("#msg").className="err";
  $("#msg").textContent="Error: "+e.message;
